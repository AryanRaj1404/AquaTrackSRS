<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AquaTrack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI
        }

        body {
            background: linear-gradient(135deg, #0f172a, #2563eb, #38bdf8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px
        }

        .c {
            width: 920px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #ffffff20;
            backdrop-filter: blur(16px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px #0005
        }

        .l {
            background: #2563eb;
            color: #fff;
            padding: 40px
        }

        .l h1 {
            font-size: 42px
        }

        .l p {
            margin: 15px 0
        }

        .l li {
            margin: 12px 0
        }

        .r {
            background: #fff;
            padding: 36px
        }

        .tabs {
            display: flex;
            background: #eef2ff;
            border-radius: 10px;
            overflow: hidden
        }

        .tabs button {
            flex: 1;
            padding: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer
        }

        .active {
            background: #2563eb;
            color: #fff
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 10px
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        #msg {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px
        }

        .ok {
            background: #dcfce7;
            color: #166534
        }

        .err {
            background: #fee2e2;
            color: #991b1b
        }

        #dash {
            display: none;
            margin-top: 20px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px
        }

        textarea {
            width: 100%;
            height: 110px;
            margin-top: 10px
        }

        button.small {
            width: 49%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: #fff
        }

        .copy {
            background: #111827
        }

        .logout {
            background: #dc2626;
            float: right
        }
    </style>
</head>

<body>
    <div class='c'>
        <div class='l'>
            <h1>💧 AquaTrack</h1>
            <p>JWT Authentication Demo</p>
            <ul>
                <li>Spring Boot</li>
                <li>PostgreSQL</li>
                <li>BCrypt</li>
                <li>JWT</li>
                <li>Spring Security</li>
            </ul>
        </div>
        <div class='r'>
            <div class='tabs'><button id='t1' class='active' onclick='mode="login";sw()'>Login</button><button id='t2'
                    onclick='mode="register";sw()'>Register</button></div><input id='u' placeholder='Username'><input
                id='p' type='password' placeholder='Password'><button id='act' class='btn' onclick='go()'>Login</button>
            <div id='msg'></div>
            <div id='dash'>
                <h3>✅ Authentication Successful</h3>
                <p>User: <b id='name'></b></p><textarea id='tok' readonly></textarea><button class='small copy'
                    onclick='navigator.clipboard.writeText(tok.value)'>Copy Token</button><button class='small logout'
                    onclick='localStorage.removeItem("jwt");dash.style.display="none"'>Logout</button>
            </div>
        </div>
    </div>
    <script>
        let mode = 'login';
        function sw() { t1.classList.toggle('active', mode == = 'login');
        t2.classList.toggle('active', mode == = 'register');
        act.innerText = mode == = 'login' ? 'Login': 'Register' } function show(m, s) { msg.style.display = 'block';
        msg.className = s ? 'ok': 'err';
        msg.innerHTML = m } async function
        go() { let body = JSON.stringify({ username: u.value, password: p.value });
        let url = mode == = 'login' ? '/auth/login': '/auth/register';
        try { let r = await fetch(
            url,
            { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body }
        );
        if (mode == = 'register') { show(await r.text(), r.ok);
        return;
        } let d = await r.json();
        if (d.token) { localStorage.setItem('jwt', d.token);
        show('Login Successful', true);
        dash.style.display = 'block';
        name.innerText = u.value;
        tok.value = d.token }
        else show('Login Failed', false);
        } catch (e) { show('Server unavailable', false) } }
    </script>
        </body>

</html>
